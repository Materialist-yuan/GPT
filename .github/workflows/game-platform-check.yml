name: game-platform-check
on:
  push:
    paths: ["game-platform/**", ".github/workflows/game-platform-check.yml"]
  pull_request:
    paths: ["game-platform/**", ".github/workflows/game-platform-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: game-platform
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: game
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: game_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U game -d game_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://game:isolated_ci_password@127.0.0.1:5432/game_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: game-platform/go.mod
          cache: true
          cache-dependency-path: game-platform/go.sum
      - run: make check build
